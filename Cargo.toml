[package]
name = "worko-ai-usage"
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
description = "Privacy-safe Claude Code and Codex usage collector for Worko HR"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
hex = "0.4"
hostname = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
walkdir = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
